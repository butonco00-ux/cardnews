name: 확인 페이지 갱신

# 노트북이 보도자료 카드를 올리면 확인 페이지(HTML)를 다시 만든다.
on:
  push:
    branches: [main]
    paths:
      - "docs/*/set-1/**"
      - "docs/*/run-gov.json"
      - "docs/*/releases.json"
      - "docs/*/set-3/**"
      - "docs/*/set-4/**"
      - "docs/*/run-law.json"
      - "docs/*/run-easylaw.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardnews-repo
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 한자 글꼴 설치(뉴스 카드 다시 그릴 때)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: 확인 페이지 다시 만들기
        env:
          TZ: Asia/Seoul
        run: python -m engine.make --only pages
      - name: 저장
        run: |
          bash scripts/save_and_push.sh "확인 페이지 갱신"
