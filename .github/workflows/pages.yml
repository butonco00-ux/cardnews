name: 확인 페이지 갱신

# 노트북이 보도자료 카드를 올리면 확인 페이지(HTML)를 다시 만든다.
on:
  push:
    branches: [main]
    paths:
      - "docs/*/set-1/**"
      - "docs/*/run-gov.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardnews-repo
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: 확인 페이지 다시 만들기
        env:
          TZ: Asia/Seoul
        run: python -m engine.make --only pages
      - name: 저장
        run: |
          git config user.name "cardnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "확인 페이지 갱신"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
