name: 매일 뉴스 카드 만들기

on:
  schedule:
    # 매일 07:00 한국시간(UTC 22:00). GitHub 사정으로 수십 분 늦을 수 있음
    # 정부 보도자료 카드(세트 1)는 노트북이 만든다(한국 정부 사이트가 해외 서버 접속을 막음).
    # 여기서는 뉴스 헤드라인(세트 2)·토큰 확인·확인 페이지만.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 (비우면 오늘) 예) 2026-09-17"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cardnews-repo
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 한자 글꼴 설치(글꼴에 없는 글자용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 부품 설치
        run: pip install -q -r requirements.txt

      - name: 뉴스 카드 만들기
        env:
          TZ: Asia/Seoul
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO_NAME: ${{ github.repository }}
          RUN_DATE: ${{ inputs.date }}
        run: python -m engine.make --only news --date "$RUN_DATE"

      - name: 결과 저장(확인 페이지 갱신)
        if: always()
        run: |
          bash scripts/save_and_push.sh "뉴스 카드 만들기 $(TZ=Asia/Seoul date +%F)"
